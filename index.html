<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'/>
  <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css' rel='stylesheet'/>
  <script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
  <style> 
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 45vw;
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }
    /* Larger tap targets and readable text on small screens */
    @media (max-width: 480px) {
      #legend { font-size: 11px; padding: 8px 10px; bottom: 20px; }
      .mapboxgl-popup-content { font-size: 14px; padding: 12px; }
      .mapboxgl-popup-content a, .mapboxgl-popup-content button {
        display: inline-block;
        padding: 4px 2px;
        font-size: 13px !important;
      }
    }
  </style>
</head>
<body>
<div id='map'></div>
<div id='legend'>
  <div><span class='dot' style='background:#B8860B'></span>Antique</div>
  <div><span class='dot' style='background:#008080'></span>Secondhand</div>
  <div><span class='dot' style='background:#B08080'></span>Vintage</div>
  <div><span class='dot' style='background:#4A6FA5'></span>Flea</div>
  <div><span class='dot' style='background:#556B2F'></span>Car Boot</div>
  <div><span class='dot' style='background:#8B4513'></span>Furniture</div>
  <div><span class='dot' style='background:#888888'></span>Mixed</div>
</div>
<div id='loading' style='position:absolute;top:10px;left:10px;background:white;padding:6px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.2);'>
  Loading markets…
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibWVhZG93OSIsImEiOiJjbXFjenY5djQwNTQ0MnFyNHFkbzZzMjd2In0.ebRTCqNV5tnNssrcH_2MeA';

const SUPABASE_URL = 'https://suwrvziijpqdnxojmezi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4esOO3miwJCUWmw2fDVnyA_dTAgmK5d';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [-0.1276, 51.5074],
  zoom: 11
});

const colours = {
  antique:    '#B8860B',
  secondhand: '#008080',
  vintage:    '#B08080',
  flea:       '#4A6FA5',
  car_boot:   '#556B2F',
  furniture:  '#8B4513',
  mixed:      '#888888'
};
const DEFAULT_COLOUR = '#888888';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addMarketMarker(m) {
  if (m.lat == null || m.lng == null) return; // skip anything that failed geocoding

  const colour = colours[m.category] || DEFAULT_COLOUR;

  // schedule is now generated from structured data at collection time, so
  // it's a single reliable line — no separate opening-hours formatting needed.
  const scheduleLine = m.schedule
    ? `<br/><span style='color:#666;font-size:12px'>${escapeHtml(m.schedule)}</span>` : '';
  const descLine = m.description
    ? `<br/><span style='font-size:12px'>${escapeHtml(m.description)}</span>` : '';
  const addressLine = m.address
    ? `<br/><span style='color:#999;font-size:11px'>${escapeHtml(m.address)}</span>` : '';
  const linkLine = (m.source_url && m.source_url.startsWith('http'))
    ? `<br/><a href='${m.source_url}' target='_blank' rel='noopener' style='font-size:12px'>More info →</a>`
    : '';

  // Directions via Google Maps (opens the native app on mobile if installed,
  // browser otherwise) — no in-app routing to build or pay for.
  const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}`;
  const actionsRow = `
    <br/>
    <a href='${directionsUrl}' target='_blank' rel='noopener' style='font-size:12px'>🧭 Directions</a>
    ${m.address ? `&nbsp;·&nbsp;<button class='copy-address-btn' style='font-size:12px;border:none;background:none;color:#1a73e8;cursor:pointer;padding:0;'>📋 Copy address</button>` : ''}
  `;

  const popup = new mapboxgl.Popup({ offset: 25 })
    .setHTML(`
      <strong>${escapeHtml(m.name)}</strong><br/>
      <span style='color:#666;font-size:12px'>${m.category || ''}</span>
      ${scheduleLine}
      ${descLine}
      ${addressLine}
      ${linkLine}
      ${actionsRow}
    `);

  // Attach the copy-to-clipboard handler each time the popup opens (its DOM
  // is recreated on open, so this can't be wired up before that).
  popup.on('open', () => {
    const el = popup.getElement();
    const copyBtn = el && el.querySelector('.copy-address-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(m.address).then(() => {
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => { copyBtn.textContent = '📋 Copy address'; }, 1500);
        });
      });
    }
  });

  new mapboxgl.Marker({ color: colour })
    .setLngLat([m.lng, m.lat])
    .setPopup(popup)
    .addTo(map);
}

function isOnMap(m, todayStr) {
  if (m.lat == null || m.lng == null) return false; // failed geocoding — never shown
  if (m.is_recurring === true) return true;          // recurring markets never expire
  if (!m.next_date) return true;                     // no date at all — treat as always current
  return m.next_date >= todayStr;                    // one-off event — only if still upcoming
}

async function loadMarkets() {
  const loadingEl = document.getElementById('loading');
  try {
    const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD

    // Fetch everything — filtering now happens here in JS, not in the query,
    // so we can both render the right markers AND record on_map per row.
    const { data, error } = await supabaseClient.from('markets').select('*');
    if (error) throw error;

    const rows = data || [];
    const onMapIds = [];
    const offMapIds = [];

    rows.forEach(m => {
      if (isOnMap(m, today)) {
        addMarketMarker(m);
        onMapIds.push(m.id);
      } else {
        offMapIds.push(m.id);
      }
    });

    loadingEl.textContent = `${onMapIds.length} markets loaded`;
    setTimeout(() => { loadingEl.style.display = 'none'; }, 2000);

    // Record which rows are currently on the map — for testing/inspection in
    // the Supabase Table Editor. Doesn't affect what's rendered above.
    if (onMapIds.length) {
      await supabaseClient.from('markets').update({ on_map: true }).in('id', onMapIds);
    }
    if (offMapIds.length) {
      await supabaseClient.from('markets').update({ on_map: false }).in('id', offMapIds);
    }
  } catch (err) {
    console.error('Failed to load markets from Supabase:', err);
    loadingEl.textContent = 'Failed to load markets — check console';
    loadingEl.style.background = '#fee';
  }
}

map.on('load', loadMarkets);
</script>
</body>
</html>
